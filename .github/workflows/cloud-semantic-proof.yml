name: Synthetic cloud semantic proof

on:
  push:
    branches: [stage21-cloud-semantic-proof]
    paths:
      - "scripts/cloud_semantic_smoke.py"
      - "scripts/cloud_semantic_holdouts.py"
      - "tests/test_cloud_semantic_holdouts.py"
      - "src/file_evidence_candidate_bridge.py"
      - "tests/test_cloud_semantic_smoke.py"
      - "src/evidence_subject_selection.py"
      - "tests/test_evidence_subject_selection.py"
      - ".github/workflows/cloud-semantic-proof.yml"

permissions:
  contents: read

concurrency:
  group: technology-library-synthetic-cloud-proof
  cancel-in-progress: false

jobs:
  proof:
    name: Proof ${{ matrix.suite }} ${{ matrix.start }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {suite: original, start: 0}
          - {suite: original, start: 5}
          - {suite: holdouts, start: 0}
          - {suite: holdouts, start: 5}
          - {suite: holdouts, start: 10}
          - {suite: holdouts, start: 15}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      CUDA_VISIBLE_DEVICES: '-1'
      PROOF_SUITE: ${{ matrix.suite }}
      PROOF_START: ${{ matrix.start }}
    steps:
      - name: Checkout synthetic proof code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install verified runtime and run bounded synthetic proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_cloud_semantic_smoke.py -v
          python3 -m unittest discover -s tests -p test_evidence_subject_selection.py -v
          python3 -m unittest discover -s tests -p test_cloud_semantic_holdouts.py -v
          proof_dir="${RUNNER_TEMP}/tl-cloud-proof"
          mkdir -p "$proof_dir/runtime" "$proof_dir/models"
          server_pid=''
          cleanup() {
            if [ -n "$server_pid" ]; then kill "$server_pid" 2>/dev/null || true; fi
            rm -rf "$proof_dir"
          }
          trap cleanup EXIT
          curl --fail --location --silent --show-error --max-time 240 \
            https://github.com/ollama/ollama/releases/download/v0.40.0/ollama-linux-amd64.tar.zst \
            --output "$proof_dir/runtime.tar.zst"
          echo 'c94aa4156b3d13e64ebc2efe5ea53f015384c882be776e6695cfb37fb180d5ad  '"$proof_dir/runtime.tar.zst" | sha256sum --check --status
          tar --zstd -xf "$proof_dir/runtime.tar.zst" -C "$proof_dir/runtime"
          rm "$proof_dir/runtime.tar.zst"
          export OLLAMA_MODELS="$proof_dir/models"
          "$proof_dir/runtime/bin/ollama" serve > "$proof_dir/server.log" 2>&1 &
          server_pid=$!
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/version > /dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          timeout 240 "$proof_dir/runtime/bin/ollama" pull qwen3.5:9b > "$proof_dir/pull.log" 2>&1
          python3 scripts/cloud_semantic_smoke.py --suite "$PROOF_SUITE" --start "$PROOF_START" --count 5
