name: Candidate semantic smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "src/candidate_source_probe.py"
      - "src/candidate_semantic_local.py"
      - "src/candidate_semantic_contract.py"
      - "src/candidate_batch_plan.py"
      - "src/candidate_semantic_batch.py"
      - "src/candidate_resolution.py"
      - "src/candidate_split_plan.py"
      - "src/candidate_quality_benchmark.py"
      - "src/ready_evidence_bridge.py"
      - "src/file_evidence_semantic_plan.py"
      - "src/file_evidence_semantic_batch.py"
      - "src/file_evidence_candidate_bridge.py"
      - "src/stage16b_real_item.py"
      - "src/rclone_bridge.py"
      - "src/media_router.py"
      - "src/ready_index.py"
      - "src/curation_handoff.py"
      - "src/link_bridge.py"
      - "src/text_document_bridge.py"
      - "tests/test_candidate_source_probe_github.py"
      - "tests/test_candidate_split_plan.py"
      - "tests/test_candidate_quality_benchmark.py"
      - "tests/test_ready_evidence_bridge.py"
      - "tests/test_file_evidence_semantic_plan.py"
      - "tests/test_file_evidence_semantic_batch.py"
      - "tests/test_file_evidence_candidate_bridge.py"
      - "tests/test_stage16b_real_item.py"
      - "tests/test_stage16b_unicode_storage.py"
      - "tests/test_rclone_bridge_selection.py"
      - ".github/workflows/candidate-semantic-smoke-test.yml"

permissions:
  contents: read

concurrency:
  group: technology-library-candidate-semantic-smoke
  cancel-in-progress: true

jobs:
  candidate-semantic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce zero-additional-cost guardrail
        run: python3 src/cost_guardrail.py

      - name: Validate source probe, local semantic fail-closed behavior, batch helpers and resolution routing
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "src")

          from candidate_resolution import build_plan as build_resolution_plan
          from candidate_semantic_batch import build_state, fallback_review
          from candidate_semantic_contract import validate_semantic_payload
          from candidate_semantic_local import build_outputs, endpoint_is_loopback
          from candidate_source_probe import address_is_public, extract_urls, normalize_url

          text = """TYPE: CANDIDATE
          CANDIDATE_STATUS: TO_REVIEW
          PROPOSED_TYPE: TECHNOLOGY
          PROPOSED_STATUS: TEST
          PROPOSED_DOMAIN: 04_AI_AGENTS
          PROPOSED_CATEGORY: INTEGRATIONS
          TITLE: Synthetic Local Semantic Candidate
          LAST_CHECKED: 2026-09-10
          SOURCE_ORIGIN: Synthetic test only.

          # Synthetic Candidate
          Sources:
          - https://example.com/docs.
          - https://github.com/example/repo
          """.replace("          ", "")

          urls = extract_urls(text)
          assert urls == ["https://example.com/docs", "https://github.com/example/repo"], urls
          assert normalize_url("ftp://example.com/a") is None
          assert address_is_public("127.0.0.1") is False
          assert address_is_public("8.8.8.8") is True

          assert endpoint_is_loopback("http://127.0.0.1:11434") is True
          assert endpoint_is_loopback("http://localhost:11434") is True
          assert endpoint_is_loopback("https://api.example.com") is False

          model = {
              "decision": "VALIDATED_NEW",
              "evidence_level": "HIGH",
              "proposed_type": "TECHNOLOGY",
              "proposed_status": "TEST",
              "canonical_match_path": None,
              "rationale": "Synthetic retrieved evidence supports the candidate.",
          }
          probe = {
              "schema_version": 1,
              "sources": [{"status": "OK", "source_url": "https://example.com/docs", "excerpt": "support"}],
          }
          rich, decision, errors = build_outputs(text, probe, model)
          assert not errors, errors
          assert rich["final_review"]["decision"] == "VALIDATED_NEW", rich
          assert decision["items"][0]["decision"] == "VALIDATED_NEW", decision

          candidate_id = rich["candidate_id"]
          candidate_sha = rich["candidate_sha256"]
          index = {
              "schema_version": 1,
              "entries": [
                  {
                      "candidate_id": candidate_id,
                      "sha256": candidate_sha,
                      "valid": True,
                      "path": "CHAT_RESEARCH/candidate-synthetic-local-semantic.md",
                  }
              ],
          }
          accepted, contract_errors = validate_semantic_payload(decision, index)
          assert len(accepted) == 1 and not contract_errors, (accepted, contract_errors)

          resolution, resolution_errors = build_resolution_plan(index, decision)
          assert not resolution_errors, resolution_errors
          assert resolution["items"][0]["destination_path"].startswith("READY_FOR_CURATION/"), resolution
          assert resolution["canonical_write_performed"] is False
          assert resolution["physical_delete_performed"] is False

          no_source_rich, no_source_decision, no_source_errors = build_outputs(text, {"sources": []}, model)
          assert not no_source_errors, no_source_errors
          assert no_source_rich["final_review"]["decision"] == "NEEDS_REVIEW", no_source_rich
          assert "promotion_without_retrieved_source" in no_source_rich["policy_reasons"]
          assert no_source_decision["items"][0]["evidence_level"] == "LOW"

          review_resolution, review_resolution_errors = build_resolution_plan(index, no_source_decision)
          assert not review_resolution_errors, review_resolution_errors
          assert review_resolution["items"][0]["destination_path"].startswith("NEEDS_REVIEW/NEEDS_REVIEW/"), review_resolution

          split_model = {
              "decision": "SPLIT_REQUIRED",
              "evidence_level": "HIGH",
              "proposed_type": "TECHNOLOGY",
              "proposed_status": "TEST",
              "canonical_match_path": "00_LIBRARY/04_AI_AGENTS/INTEGRATIONS/technology-existing.md",
              "rationale": "The research bundle contains two independently maintainable tools.",
          }
          split_rich, split_decision, split_errors = build_outputs(text, probe, split_model)
          assert not split_errors, split_errors
          assert split_rich["final_review"]["decision"] == "SPLIT_REQUIRED", split_rich
          assert split_rich["final_review"]["proposed_type"] is None
          assert split_rich["final_review"]["proposed_status"] is None
          assert split_rich["final_review"]["canonical_match_path"] is None
          assert "multi_subject_candidate_requires_split" in split_rich["policy_reasons"]
          split_accepted, split_contract_errors = validate_semantic_payload(split_decision, index)
          assert len(split_accepted) == 1 and not split_contract_errors, (split_accepted, split_contract_errors)
          split_resolution, split_resolution_errors = build_resolution_plan(index, split_decision)
          assert not split_resolution_errors, split_resolution_errors
          assert split_resolution["items"][0]["destination_path"].startswith("NEEDS_REVIEW/SPLIT_REQUIRED/"), split_resolution
          assert split_resolution["canonical_write_performed"] is False

          fallback_rich, fallback_decision = fallback_review(candidate_id, candidate_sha, "synthetic_failure")
          assert fallback_rich["final_review"]["decision"] == "NEEDS_REVIEW"
          assert fallback_decision["evidence_level"] == "LOW"
          state = build_state(
              {"state": "DUE", "reason": "volume_threshold"},
              [fallback_decision, decision["items"][0]],
              failures=1,
          )
          assert state["decision_counts"]["NEEDS_REVIEW"] == 1
          assert state["decision_counts"]["VALIDATED_NEW"] == 1
          assert state["paid_model_used"] is False
          assert state["canonical_write_performed"] is False

          update_without_match = dict(model)
          update_without_match["decision"] = "VALIDATED_UPDATE"
          update_rich, _, update_errors = build_outputs(text, probe, update_without_match)
          assert not update_errors, update_errors
          assert update_rich["final_review"]["decision"] == "NEEDS_REVIEW", update_rich
          assert "canonical_match_required" in update_rich["policy_reasons"]

          print("candidate_source_probe_helpers_ok semantic_local_fail_closed_ok split_required_route_ok semantic_batch_helpers_ok candidate_resolution_plan_ok")
          PY

      - name: Validate bounded GitHub README evidence routing
        run: python3 tests/test_candidate_source_probe_github.py

      - name: Validate split plan contract
        run: python3 tests/test_candidate_split_plan.py

      - name: Validate candidate quality benchmark contract
        run: python3 tests/test_candidate_quality_benchmark.py

      - name: Validate READY file-evidence convergence contract
        run: python3 tests/test_ready_evidence_bridge.py

      - name: Validate file-evidence semantic plan contract
        run: python3 tests/test_file_evidence_semantic_plan.py

      - name: Validate file-evidence semantic batch fail-closed contract
        run: python3 tests/test_file_evidence_semantic_batch.py

      - name: Validate production file-evidence candidate bridge
        run: python3 tests/test_file_evidence_candidate_bridge.py

      - name: Validate opt-in real-item selector
        run: python3 tests/test_stage16b_real_item.py

      - name: Validate UTF-8 rclone metadata on Windows
        run: python3 tests/test_stage16b_unicode_storage.py

      - name: Validate exact video bridge selection
        run: python3 tests/test_rclone_bridge_selection.py

      - name: Verify clean workspace
        run: test -z "$(git status --porcelain)"
