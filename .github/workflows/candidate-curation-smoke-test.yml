permissions:
  contents: read

concurrency:
  group: technology-library-candidate-curation-smoke
  cancel-in-progress: true

jobs:
  candidate-curation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce zero-additional-cost guardrail
        run: python3 src/cost_guardrail.py

      - name: Validate candidate semantic-to-settlement boundary
        run: |
          python3 tests/test_candidate_pipeline.py
          python3 tests/test_candidate_editorial_gate.py
          python3 tests/test_candidate_record_template.py
          python3 tests/test_candidate_finalize_helpers.py
          python3 tests/test_candidate_batch_inspect.py
          python3 tests/test_candidate_batch_editorial_acceptance.py
          python3 tests/test_candidate_hold_inspect.py
          python3 tests/test_candidate_retrieval_preflight.py
          python3 tests/test_candidate_retrieval_routing_local.py
          python3 tests/test_candidate_remote_coordination_policy.py
          python3 tests/test_candidate_git_ref_coordination_fixture.py
          python3 tests/test_candidate_git_ref_remote_probe.py
          python3 tests/test_candidate_git_ref_capability_descriptor.py
          python3 tests/test_candidate_remote_recovery_probe.py
          python3 tests/test_candidate_remote_recovery_capability_descriptor.py
          python3 tests/test_candidate_remote_recovery_policy.py
          python3 tests/test_candidate_executor_remote_wiring_fixture.py
          python3 tests/test_candidate_executor_remote_recovery_fixture.py
          python3 tests/test_candidate_executor_readiness.py
          python3 tests/test_candidate_transaction_publish.py
          python3 tests/test_candidate_production_coordinator.py
          python3 tests/test_candidate_transaction_prewrite_arm.py
          python3 tests/test_candidate_canonical_record_mutation.py
          python3 tests/test_candidate_canonical_record_mutation_remote_fixture.py
          python3 tests/test_candidate_canonical_index_rebuild.py
          python3 tests/test_candidate_canonical_transaction_engine.py
          python3 tests/test_candidate_canonical_transaction_remote_fixture.py
          python3 tests/test_candidate_production_coordinator_commit.py
          python3 tests/test_candidate_transaction_commit_engine.py
          python3 tests/test_candidate_transaction_commit_remote_fixture.py
          python3 tests/test_candidate_production_recovery_engine.py
          python3 tests/test_candidate_production_recover.py
          python3 tests/test_candidate_production_restart_recovery_fixture.py
          python3 tests/test_candidate_stage_12a_preflight.py
          python3 tests/test_candidate_controlled_publish.py
          python3 tests/test_candidate_stage_13_verification.py
          python3 tests/test_candidate_stage_14_verification.py
          python3 tests/test_candidate_stage_15_settlement.py
          python3 tests/test_candidate_update_plan.py
          python3 tests/test_candidate_update_render.py
          python3 tests/test_candidate_update_ready.py
          python3 tests/test_candidate_finalize_batch.py
          python3 tests/test_candidate_transaction_plan.py
          python3 tests/test_candidate_transaction_prepare.py
          python3 tests/test_candidate_transaction_fixture.py
          python3 tests/test_candidate_transaction_recovery_fixture.py
          python3 tests/test_candidate_transaction_lease_fixture.py
          python3 tests/test_candidate_transaction_orchestrator_fixture.py
          python3 tests/test_candidate_transaction_receipt.py
          python3 tests/test_candidate_settlement_plan.py
          python3 tests/test_candidate_settlement_fixture.py
          python3 tests/test_retrieval_regression_cases.py

      - name: Verify clean workspace
        run: test -z "$(git status --porcelain)"
