name: Security gate

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: technology-library-ingestor-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run project security gate
        run: python3 scripts/security_gate.py

      - name: Test zero-touch intake with synthetic metadata only
        run: python3 -m unittest tests.test_zero_touch_intake -q

      - name: Enforce zero-additional-cost source guardrail
        run: python3 src/cost_guardrail.py

      - name: Confirm no generated workspace changes
        run: test -z "$(git status --porcelain)"
