name: Security gate

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: technology-library-ingestor-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run project security gate
        run: python3 scripts/security_gate.py

      - name: Test zero-touch intake with synthetic metadata only
        run: python3 -m unittest tests.test_zero_touch_intake tests.test_intake_daily_session -q

      - name: Test E1 lot assembler with synthetic evidence only
        run: python3 -m unittest tests.test_e1_lote_prepare -q

      - name: Test isolated E2 decisions with synthetic evidence only
        run: python3 -m unittest tests.test_e2_gemini_decide tests.test_cost_guardrail_g03b -q

      - name: Test E3 in-memory transaction simulation with synthetic records
        run: python3 -m unittest tests.test_e3_transaction_preflight -q

      - name: Test synthetic E3 durable snapshot and recovery fixture
        run: python3 -m unittest tests.test_e3_recovery_fixture -q

      - name: Test isolated E3 terminal receipt and committed-state hashes
        run: python3 -m unittest tests.test_e3_terminal_receipt -q

      - name: Test immutable E1 E3 receipt sidecar reconciliation
        run: python3 -m unittest tests.test_e3_lote_state -q

      - name: Test E3 private immutable write uncertainty and reconciliation
        run: python3 -m unittest tests.test_e3_private_write -q

      - name: Test E1 E2 E3 synthetic HOLD and continuation flow
        run: python3 -m unittest tests.test_e123_synthetic_integration -q

      - name: Test E3 local Git CAS coordinator and recovery isolation
        run: python3 -m unittest tests.test_e3_coordinator_fixture -q

      - name: Test E2 synthetic Gemini acceptance wrapper without external calls
        run: python3 -m unittest tests.test_e2_synthetic_smoke -q

      - name: Verify read-only E3 canonical Drive audit with synthetic fixtures
        run: python3 -m unittest tests.test_e3_remote_readonly_audit -q

      - name: Test E3 CREATE/UPDATE compatibility with real receipt validator
        run: python3 -m unittest tests.test_e3_receipt_contract -q

      - name: Test complete E3 durable synthetic commit and verified terminal receipt
        run: python3 -m unittest tests.test_e3_commit_fixture -q

      - name: Test uncertain Drive timeout never authorizes rollback
        run: python3 -m unittest tests.test_e3_remote_timeout_safety -q

      - name: Enforce zero-additional-cost source guardrail
        run: python3 src/cost_guardrail.py

      - name: Confirm no generated workspace changes
        run: test -z "$(git status --porcelain)"
